<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Sha | Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Shop-specific styles */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr; /* 1 column on mobile */
      gap: 24px;
      margin-bottom: 40px;
    }
    
    /* 2 columns on larger screens */
    @media (min-width: 650px) {
      .shop-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .shop-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .shop-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #374151; /* Placeholder */
    }
    .shop-details {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1; /* Pushes buttons to the bottom */
    }
    .shop-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 8px 0;
    }
    .shop-price {
      color: var(--primary-color);
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    
    /* Dual Button Layout */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }
    .btn-buy {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-buy:hover {
      background-color: var(--primary-hover);
    }
    .btn-local {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-local:hover {
      border-color: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>

  <!-- Smart Nav Injection -->
  <div id="nav-container" style="width: 100%;"></div>

  <div class="container">
    <h2 class="page-title">Digital Templates</h2>
    
    <div class="shop-grid">
      
      <!-- ========================================== -->
      <!-- TEMPLATE 1                                 -->
      <!-- ========================================== -->
      <div class="shop-card">
        <img src="https://via.placeholder.com/600x300/4b5563/ffffff?text=Social+Media+Kit" alt="Social Media Kit">
        <div class="shop-details">
          <h3 class="shop-title">Instagram Branding Kit</h3>
          <div class="shop-price">$25.00</div>
          
          <div class="button-group">
            <!-- Add Stripe/Payment link here later -->
            <a href="#" class="btn-buy">Buy Online</a>
            
            <!-- Opens email pre-filled with the subject line -->
            <a href="mailto:her-email@gmail.com?subject=Local Payment: Instagram Branding Kit" class="btn-local">Contact for Local Payment</a>
          </div>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- TEMPLATE 2                                 -->
      <!-- ========================================== -->
      <div class="shop-card">
        <img src="https://via.placeholder.com/600x300/4b5563/ffffff?text=Stream+Overlay" alt="Stream Overlay">
        <div class="shop-details">
          <h3 class="shop-title">Twitch Stream Overlay</h3>
          <div class="shop-price">$15.00</div>
          
          <div class="button-group">
            <a href="#" class="btn-buy">Buy Online</a>
            <a href="mailto:her-email@gmail.com?subject=Local Payment: Twitch Stream Overlay" class="btn-local">Contact for Local Payment</a>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="nav.js"></script>
</body>
</html>
