<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr; 
      gap: 24px;
      margin-bottom: 40px;
    }
    @media (min-width: 650px) {
      .shop-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .shop-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .shop-card img { width: 100%; height: 220px; object-fit: cover; background-color: #374151; }
    .shop-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .shop-title { font-size: 20px; font-weight: bold; margin: 0 0 8px 0; }
    .shop-price { color: var(--primary-color); font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .btn-buy {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      margin-top: auto;
    }
    .btn-buy:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
  </style>
</head>
<body>

  <div id="nav-container" style="width: 100%; position: relative; z-index: 10;"></div>

  <div class="container">
    <h2 class="page-title">Digital Templates</h2>
    
    <!-- This empty div is where Firebase will inject the templates -->
    <div id="shop-grid" class="shop-grid">
      <p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; margin-top: 40px;">Loading templates...</p>
    </div>
  </div>

  <script src="nav.js"></script>

  <!-- Firebase Fetch Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCecl3QPW8fkn3ZlfGqyo9VwC_Ar53br70",
      authDomain: "sha-s-designs.firebaseapp.com",
      projectId: "sha-s-designs",
      storageBucket: "sha-s-designs.firebasestorage.app",
      messagingSenderId: "34957426865",
      appId: "1:34957426865:web:023ba0243629949b12e290"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // CHANGE THIS TO HER ACTUAL EMAIL
    const MY_EMAIL = "her-email@gmail.com";

    async function loadShopItems() {
      const grid = document.getElementById('shop-grid');
      try {
        const q = query(collection(db, "shop_items"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          grid.innerHTML = "<p style='text-align: center; color: var(--text-muted); grid-column: 1 / -1;'>No templates available right now.</p>";
          return;
        }

        let html = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          html += `
            <div class="shop-card">
              <img src="${data.imageUrl}" alt="${data.title}">
              <div class="shop-details">
                <h3 class="shop-title">${data.title}</h3>
                <div class="shop-price">$${data.price}</div>
                <a href="mailto:${MY_EMAIL}?subject=Purchase Request: ${data.title}" class="btn-buy">Contact to Buy</a>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch (error) {
        console.error("Firebase Error:", error);
        grid.innerHTML = "<p style='text-align: center; color: #ef4444; grid-column: 1 / -1;'>Error loading templates.</p>";
      }
    }

    loadShopItems();
  </script>
</body>
</html>
