<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Shop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr; 
      gap: 24px;
      margin-bottom: 40px;
    }
    @media (min-width: 650px) {
      .shop-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .shop-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .shop-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #374151; 
    }
    .shop-details {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1; 
    }
    .shop-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 8px 0;
    }
    .shop-price {
      color: var(--primary-color);
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    
    /* Single Primary Button Layout */
    .btn-buy {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      margin-top: auto;
    }
    .btn-buy:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div id="nav-container" style="width: 100%; position: relative; z-index: 10;"></div>

  <div class="container">
    <h2 class="page-title">Digital Templates</h2>
    
    <div class="shop-grid">
      
      <div class="shop-card">
        <img src="https://via.placeholder.com/600x300/4b5563/ffffff?text=Social+Media+Kit" alt="Social Media Kit">
        <div class="shop-details">
          <h3 class="shop-title">Instagram Branding Kit</h3>
          <div class="shop-price">$25.00</div>
          <!-- Replaced with a single, direct email button -->
          <a href="mailto:her-email@gmail.com?subject=Purchase Request: Instagram Branding Kit" class="btn-buy">Contact to Buy</a>
        </div>
      </div>

      <div class="shop-card">
        <img src="https://via.placeholder.com/600x300/4b5563/ffffff?text=Stream+Overlay" alt="Stream Overlay">
        <div class="shop-details">
          <h3 class="shop-title">Twitch Stream Overlay</h3>
          <div class="shop-price">$15.00</div>
          <a href="mailto:her-email@gmail.com?subject=Purchase Request: Twitch Stream Overlay" class="btn-buy">Contact to Buy</a>
        </div>
      </div>

    </div>
  </div>

  <script src="nav.js"></script>
</body>
</html>
