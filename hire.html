<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Hire & Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .masonry-grid {
      column-count: 2; 
      column-gap: 16px;
      margin-bottom: 60px;
    }
    @media (min-width: 600px) {
      .masonry-grid { column-count: 3; }
    }
    .grid-item {
      display: inline-block;
      width: 100%;
      margin-bottom: 16px;
      border-radius: 12px;
      background-color: var(--card-bg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease;
    }
    .grid-item:hover { transform: scale(1.03); }
    .grid-item img {
      width: 100%;
      display: block;
      background-color: #374151;
    }

    /* Clean Business Card Style */
    .contact-card {
      background-color: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      text-align: center;
      margin-bottom: 60px;
    }
    .contact-card h3 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .contact-card p {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    .direct-email-btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
    .direct-email-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-3px);
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .social-row a {
      color: var(--text-main);
      background-color: var(--border-color);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    .social-row a:hover {
      background-color: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>

  <div id="nav-container" style="width: 100%; position: relative; z-index: 10;"></div>

  <div class="container">
    
    <h2 class="page-title">My Work</h2>
    <div class="masonry-grid">
      <div class="grid-item"><img src="https://via.placeholder.com/400x600/ec4899/ffffff?text=Design+1" alt="Design 1"></div>
      <div class="grid-item"><img src="https://via.placeholder.com/400x400/8b5cf6/ffffff?text=Design+2" alt="Design 2"></div>
      <div class="grid-item"><img src="https://via.placeholder.com/400x700/3b82f6/ffffff?text=Design+3" alt="Design 3"></div>
      <div class="grid-item"><img src="https://via.placeholder.com/400x500/10b981/ffffff?text=Design+4" alt="Design 4"></div>
    </div>

    <h2 class="page-title">Let's Work Together</h2>
    <div class="contact-card">
      <h3>Ready to start a project?</h3>
      <p>I am currently available for freelance work and custom commissions. Reach out directly below!</p>
      
      <!-- Big Direct Email Button -->
      <!-- LATER: Replace with her actual email -->
      <a href="mailto:her-email@gmail.com" class="direct-email-btn">Email Me Directly</a>
      
      <!-- Social Media Buttons -->
      <div class="social-row">
        <!-- LATER: Paste her actual links inside the href quotes -->
        <a href="#" target="_blank">Instagram</a>
        <a href="#" target="_blank">X (Twitter)</a>
        <a href="#" target="_blank">Behance</a>
      </div>
    </div>

  </div>

  <script src="nav.js"></script>
</body>
</html>
