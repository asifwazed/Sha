<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* HIGH-END STUDIO AESTHETIC */
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;500&display=swap');

    body {
      background-color: #050505; /* Deepest black */
      color: #ffffff;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
    }

    .hero-container {
      position: relative;
      width: 100%;
      min-height: 90vh;
      display: flex;
      align-items: center;
      padding: 0 5%;
      box-sizing: border-box;
    }

    /* MASSIVE EDITORIAL TYPOGRAPHY */
    .hero-text {
      position: relative;
      z-index: 10;
      max-width: 800px;
    }

    .hero-text h1 {
      font-family: 'Syncopate', sans-serif; /* Wide, high-fashion font */
      font-size: clamp(2.5rem, 6vw, 6.5rem);
      line-height: 1.1;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -2px;
    }

    /* The Designer Outline Effect */
    .text-outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
    }

    /* The Pink Glow Accent */
    .text-glow {
      color: #ec4899;
      text-shadow: 0 0 40px rgba(236, 72, 153, 0.6);
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #a3a3a3;
      margin-top: 30px;
      margin-bottom: 40px;
      max-width: 500px;
      line-height: 1.6;
    }

    /* CHIC BUTTONS (Sharp, not bubbly) */
    .btn-group {
      display: flex;
      gap: 20px;
    }

    .btn-primary-chic {
      background: #ec4899;
      color: #fff;
      padding: 16px 40px;
      font-size: 14px;
      font-family: 'Syncopate', sans-serif;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 0px; /* Sharp corners scream high-end */
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.2);
    }

    .btn-primary-chic:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
    }

    .btn-outline-chic {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px 40px;
      font-size: 14px;
      font-family: 'Syncopate', sans-serif;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 0px;
      transition: all 0.3s ease;
    }

    .btn-outline-chic:hover {
      border-color: #ec4899;
      color: #ec4899;
    }

    /* ASYMMETRICAL FLOATING ARTWORK */
    .art-showcase {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      width: 45%;
      height: 70vh;
      pointer-events: none;
    }

    .art-showcase img {
      position: absolute;
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transition: transform 0.5s ease;
    }

    .art-1 {
      width: 320px;
      height: 420px;
      object-fit: cover;
      right: 15%;
      top: 0;
      z-index: 2;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .art-2 {
      width: 250px;
      height: 350px;
      object-fit: cover;
      right: 45%;
      bottom: -10%;
      z-index: 3;
    }

    .art-3 {
      width: 200px;
      height: 280px;
      object-fit: cover;
      right: 0;
      top: 30%;
      z-index: 1;
      opacity: 0.4;
      filter: grayscale(100%);
    }

    /* Film Noise Texture Overlay */
    .noise-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Mobile adjustments */
    @media (max-width: 900px) {
      .hero-container { flex-direction: column; justify-content: center; text-align: left; padding-top: 10vh; }
      .art-showcase { position: relative; width: 100%; height: 400px; margin-top: 50px; right: 0; top: 0; transform: none; }
      .art-1 { right: 50%; transform: translateX(50%); top: 0; }
      .art-2, .art-3 { display: none; }
      .btn-group { flex-direction: column; width: 100%; max-width: 300px; }
      .btn-primary-chic, .btn-outline-chic { text-align: center; }
    }
  </style>
</head>
<body>
  
  <div class="noise-overlay"></div>
  <div id="nav-container" style="width: 100%; position: relative; z-index: 50;"></div>

  <div class="hero-container">
    
    <div class="hero-text">
      <h1>
        <span class="text-outline">Digital</span><br>
        <span class="text-glow">Aesthetics</span><br>
        By Sha
      </h1>
      <p>Elevating brand identities and digital spaces through modern, high-contrast visual design.</p>
      
      <div class="btn-group">
        <a href="explore.html" class="btn-primary-chic">View Portfolio</a>
        <a href="hire.html" class="btn-outline-chic">Commission Me</a>
      </div>
    </div>

    <!-- Replace these placeholder links with her actual best artworks -->
    <div class="art-showcase">
      <img src="https://via.placeholder.com/320x420/ec4899/ffffff?text=Main+Piece" class="art-1" alt="Art 1">
      <img src="https://via.placeholder.com/250x350/111111/ec4899?text=Secondary+Art" class="art-2" alt="Art 2">
      <img src="https://via.placeholder.com/200x280/8b5cf6/ffffff?text=Abstract" class="art-3" alt="Art 3">
    </div>

  </div>

  <script src="nav.js"></script>
</body>
</html>
