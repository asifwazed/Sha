<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Sha | Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ========================================== */
    /* ANIMATIONS                                 */
    /* ========================================== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      33% { transform: translateY(-30px) scale(1.05); }
      66% { transform: translateY(20px) scale(0.95); }
      100% { transform: translateY(0px) scale(1); }
    }

    /* ========================================== */
    /* HERO LAYOUT & BACKGROUND                   */
    /* ========================================== */
    .hero-wrapper {
      position: relative;
      width: 100%;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Keeps the glowing blobs inside */
      margin-top: 20px;
    }

    /* Floating Ambient Blobs */
    .blob {
      position: absolute;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.5;
      animation: float 12s infinite ease-in-out;
    }
    .blob-1 {
      width: 300px;
      height: 300px;
      background: var(--primary-color);
      top: 10%;
      left: 10%;
      border-radius: 50%;
    }
    .blob-2 {
      width: 250px;
      height: 250px;
      background: #8b5cf6; /* Accent Purple */
      bottom: 10%;
      right: 15%;
      border-radius: 50%;
      animation-delay: -6s; /* Makes them float out of sync */
    }

    /* ========================================== */
    /* GLASSMORPHISM CARD                         */
    /* ========================================== */
    .hero {
      text-align: center;
      max-width: 700px;
      padding: 50px 30px;
      z-index: 1;
      
      /* Frosted Glass Effect */
      background: rgba(31, 41, 55, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      
      /* Initial state before animation */
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 16px;
      line-height: 1.2;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.2s forwards;
    }

    /* Shifting Text Gradient */
    .highlight-animated {
      background: linear-gradient(270deg, var(--primary-color), #8b5cf6, var(--primary-color));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease infinite;
      font-weight: 800;
    }

    .hero p {
      color: var(--text-main);
      font-size: 18px;
      margin-bottom: 35px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
    }

    /* ========================================== */
    /* ENHANCED BUTTONS                           */
    /* ========================================== */
    .hero-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    /* Hover Lift Effects */
    .btn-primary {
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
      text-decoration: none;
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 25px rgba(236, 72, 153, 0.6);
    }
    .btn-outline:hover {
      transform: translateY(-3px);
      border-color: var(--primary-color);
      background-color: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Smart Nav Injection -->
  <div id="nav-container" style="width: 100%; position: relative; z-index: 10;"></div>

  <div class="container hero-wrapper">
    
    <!-- Animated Ambient Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <!-- Hero Content -->
    <div class="hero">
      <h1>Bringing Ideas to <span class="highlight-animated">Life.</span></h1>
      <p>Digital Graphic Designer specializing in modern branding, high-quality templates, and custom visual experiences.</p>
      
      <div class="hero-actions">
        <a href="shop.html" class="btn-primary">View Shop</a>
        <a href="hire.html" class="btn-outline">Hire Me</a>
      </div>
    </div>

  </div>

  <script src="nav.js"></script>
</body>
</html>
