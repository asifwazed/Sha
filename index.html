<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fdf2f8; /* Soft blush pink background */
      color: #4c1d95;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
      background-size: 20px 20px; /* Cute dot grid */
    }

    .hero-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
      padding: 20px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(236, 72, 153, 0.15);
      border: 2px solid #fce7f3;
    }

    .avatar {
      width: 130px;
      height: 130px;
      background-color: #fbcfe8;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 5px solid white;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.2);
      overflow: hidden;
    }

    /* You can put her logo or a cute illustration here */
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-card h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #be185d;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .profile-card p {
      color: #9d174d;
      font-size: 1.1rem;
      margin-top: 10px;
      margin-bottom: 30px;
      font-weight: 700;
    }

    /* THE UNIQUE TAB FEATURE */
    .tab-container {
      background: #fce7f3;
      border-radius: 50px;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.05);
    }

    .tab-btn {
      flex: 1;
      text-decoration: none;
      color: #be185d;
      font-weight: 800;
      padding: 14px 0;
      border-radius: 40px;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .tab-btn.highlight {
      background: #ec4899;
      color: white;
      box-shadow: 0 6px 15px rgba(236, 72, 153, 0.4);
    }

    .tab-btn.highlight:hover {
      background: #db2777;
    }

  </style>
</head>
<body>
  
  <div id="nav-container"></div>

  <div class="hero-container">
    <div class="profile-card">
      
      <div class="avatar">
        <!-- Add a cute image of her logo or avatar here -->
        <img src="https://via.placeholder.com/150/fbcfe8/be185d?text=Sha" alt="Sha Designs">
      </div>
      
      <h1>Sha's Designs</h1>
      <p>Digital Art & Aesthetic Overlays</p>
      
      <div class="tab-container">
        <a href="explore.html" class="tab-btn">Explore</a>
        <a href="shop.html" class="tab-btn">Shop</a>
        <a href="hire.html" class="tab-btn highlight">Hire Me</a>
      </div>

    </div>
  </div>

  <script src="nav.js"></script>
</body>
</html>
