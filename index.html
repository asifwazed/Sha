<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ========================================== */
    /* STUDIO GRID BACKGROUND                     */
    /* ========================================== */
    body {
      background-color: #0f172a; /* Slightly deeper dark */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      overflow-x: hidden;
    }

    /* ========================================== */
    /* ANIMATIONS                                 */
    /* ========================================== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradientPulse {
      0% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
      50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.8); }
      100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
    }
    @keyframes scrollGallery {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } /* Scrolls half the width to loop perfectly */
    }

    .hero-wrapper {
      position: relative;
      width: 100%;
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Glow */
    .glow-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ========================================== */
    /* INFINITE SCROLLING GALLERY                 */
    /* ========================================== */
    .scrolling-wrapper {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100vw;
      transform: translateY(-50%) rotate(-5deg); /* Cool angled look */
      z-index: 1;
      opacity: 0.4; /* Keeps it in the background */
      pointer-events: none;
    }
    
    .scrolling-track {
      display: flex;
      width: 200%; /* Double width for the loop */
      animation: scrollGallery 25s linear infinite;
      gap: 20px;
    }

    .scrolling-track img {
      width: 250px;
      height: 350px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* ========================================== */
    /* FOREGROUND GLASS CARD                      */
    /* ========================================== */
    .hero {
      text-align: center;
      max-width: 700px;
      padding: 60px 40px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    .highlight {
      color: var(--primary-color);
      text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }
    .hero p {
      color: var(--text-main);
      font-size: 18px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Buttons */
    .btn-explore {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 20px;
      font-weight: 800;
      padding: 16px 45px;
      border-radius: 50px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: gradientPulse 3s infinite;
      transition: transform 0.3s ease;
      margin-bottom: 30px;
    }
    .btn-explore:hover {
      transform: scale(1.05);
    }

    .secondary-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-outline {
      background-color: transparent;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-outline:hover {
      border-color: var(--primary-color);
      color: white;
      background-color: rgba(236, 72, 153, 0.1);
    }
  </style>
</head>
<body>

  <div id="nav-container" style="width: 100%; position: relative; z-index: 50;"></div>

  <div class="hero-wrapper">
    
    <!-- Central Pink Glow -->
    <div class="glow-orb"></div>
    
    <!-- Infinite Scrolling Background (Angled) -->
    <div class="scrolling-wrapper">
      <div class="scrolling-track">
        <!-- We duplicate the images so it loops seamlessly -->
        <img src="https://via.placeholder.com/250x350/ec4899/ffffff?text=Art+1" alt="Art 1">
        <img src="https://via.placeholder.com/250x350/8b5cf6/ffffff?text=Art+2" alt="Art 2">
        <img src="https://via.placeholder.com/250x350/3b82f6/ffffff?text=Art+3" alt="Art 3">
        <img src="https://via.placeholder.com/250x350/10b981/ffffff?text=Art+4" alt="Art 4">
        <img src="https://via.placeholder.com/250x350/ec4899/ffffff?text=Art+1" alt="Art 1">
        <img src="https://via.placeholder.com/250x350/8b5cf6/ffffff?text=Art+2" alt="Art 2">
        <img src="https://via.placeholder.com/250x350/3b82f6/ffffff?text=Art+3" alt="Art 3">
        <img src="https://via.placeholder.com/250x350/10b981/ffffff?text=Art+4" alt="Art 4">
      </div>
    </div>
    
    <!-- Foreground Card -->
    <div class="hero">
      <h1>Welcome to <br><span class="highlight">Sha's Designs.</span></h1>
      <p>Digital Graphic Designer specializing in modern branding, aesthetic templates, and custom visual art.</p>
      
      <div>
        <a href="explore.html" class="btn-explore">Explore My Work</a>
      </div>

      <div class="secondary-actions">
        <a href="shop.html" class="btn-outline">Shop Templates</a>
        <a href="hire.html" class="btn-outline">Contact & Hire</a>
      </div>
    </div>

  </div>

  <script src="nav.js"></script>
</body>
</html>
