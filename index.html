<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer Portfolio</title>
  <style>
    /* Base Setup */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Navigation */
    nav {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      box-sizing: border-box;
      max-width: 900px;
    }
    .logo {
      color: #f472b6;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .links a {
      color: #d1d5db;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .links a:hover {
      color: #f472b6;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      margin-top: 60px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .highlight {
      color: #f472b6;
    }
    p {
      color: #9ca3af;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #ec4899;
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
    .btn-primary:hover {
      background-color: #db2777;
    }
    .btn-secondary {
      background-color: transparent;
      border: 2px solid #4b5563;
      color: #d1d5db;
    }
    .btn-secondary:hover {
      border-color: #ec4899;
      color: white;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">DESIGNER.</div>
    <div class="links">
      <a href="#">Work</a>
      <a href="#">Templates</a>
    </div>
  </nav>

  <div class="hero">
    <h1>Bringing Ideas to <span class="highlight">Life.</span></h1>
    <p>Digital Graphic Designer specializing in modern branding, high-quality templates, and custom visual experiences.</p>
    
    <div class="buttons">
      <button class="btn-primary">View Portfolio</button>
      <button class="btn-secondary">Hire Me</button>
    </div>
  </div>

</body>
</html>
