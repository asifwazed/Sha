<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Sha | Home</title>
  <!-- Link to our global styling engine -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Hero-specific styles that don't belong in global */
    .hero {
      text-align: center;
      margin-top: 60px;
      margin-bottom: 60px;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .highlight {
      color: var(--primary-color);
    }
    .hero p {
      color: var(--text-muted);
      font-size: 18px;
      margin-bottom: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .hero-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn-outline:hover {
      border-color: var(--primary-color);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- The Smart Nav engine will inject the menu right here -->
  <div id="nav-container" style="width: 100%;"></div>

  <div class="container">
    
    <!-- Hero Section -->
    <div class="hero">
      <h1>Bringing Ideas to <span class="highlight">Life.</span></h1>
      <p>Digital Graphic Designer specializing in modern branding, high-quality templates, and custom visual experiences.</p>
      
      <div class="hero-actions">
        <!-- These buttons now route to the other pages -->
        <a href="shop.html" class="btn-primary" style="text-decoration: none;">View Shop</a>
        <a href="hire.html" class="btn-outline">Hire Me</a>
      </div>
    </div>

  </div>

  <!-- Link to our smart navigation script -->
  <script src="nav.js"></script>
</body>
</html>
