<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer Portfolio</title>
  <style>
    /* Base Setup */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Navigation */
    nav {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      box-sizing: border-box;
      max-width: 900px;
    }
    .logo {
      color: #f472b6;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .links a {
      color: #d1d5db;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .links a:hover {
      color: #f472b6;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      margin-top: 60px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .highlight {
      color: #f472b6;
    }
    p {
      color: #9ca3af;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #ec4899;
      color: white;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }
    .btn-primary:hover {
      background-color: #db2777;
    }
    .btn-secondary {
      background-color: transparent;
      border: 2px solid #4b5563;
      color: #d1d5db;
    }
    .btn-secondary:hover {
      border-color: #ec4899;
      color: white;
    }
        /* Portfolio Masonry Grid */
    .portfolio-section {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    
    .section-title {
      font-size: 24px;
      margin-bottom: 24px;
      border-left: 4px solid #ec4899;
      padding-left: 12px;
    }

    .masonry-grid {
      column-count: 2; /* 2 columns for phones */
      column-gap: 16px;
    }

    /* 3 columns for wider screens (Tablets/Laptops) */
    @media (min-width: 600px) {
      .masonry-grid {
        column-count: 3;
      }
    }

    .grid-item {
      display: inline-block;
      width: 100%;
      margin-bottom: 16px;
      border-radius: 12px;
      background-color: #1f2937;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .grid-item:hover {
      transform: scale(1.03);
    }

    .grid-item img {
      width: 100%;
      display: block;
      /* Using a placeholder gray background while images load */
      background-color: #374151; 
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">DESIGNER.</div>
    <div class="links">
      <a href="#">Work</a>
      <a href="#">Templates</a>
    </div>
  </nav>

  <div class="hero">
    <h1>Bringing Ideas to <span class="highlight">Life.</span></h1>
    <p>Digital Graphic Designer specializing in modern branding, high-quality templates, and custom visual experiences.</p>
    
    <div class="buttons">
      <button class="btn-primary">View Portfolio</button>
      <button class="btn-secondary">Hire Me</button>
    </div>
  </div>
  <div class="portfolio-section">
    <h2 class="section-title">Recent Work</h2>
    <div class="masonry-grid">
      <!-- Placeholder Items of different heights to show the Pinterest effect -->
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x600/ec4899/ffffff?text=Design+1" alt="Design 1">
      </div>
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x400/8b5cf6/ffffff?text=Design+2" alt="Design 2">
      </div>
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x700/3b82f6/ffffff?text=Design+3" alt="Design 3">
      </div>
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x500/10b981/ffffff?text=Design+4" alt="Design 4">
      </div>
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x800/f59e0b/ffffff?text=Design+5" alt="Design 5">
      </div>
      <div class="grid-item">
        <img src="https://via.placeholder.com/400x450/ef4444/ffffff?text=Design+6" alt="Design 6">
      </div>
    </div>
  </div>

</body>
</html>
