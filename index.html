<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sha's Designs | Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradientPulse {
      0% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
      50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.8); }
      100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }
    }
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      33% { transform: translateY(-30px) scale(1.05); }
      66% { transform: translateY(20px) scale(0.95); }
      100% { transform: translateY(0px) scale(1); }
    }

    .hero-wrapper {
      position: relative;
      width: 100%;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 20px;
    }

    .blob {
      position: absolute;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.5;
      animation: float 12s infinite ease-in-out;
    }
    .blob-1 { width: 300px; height: 300px; background: var(--primary-color); top: 10%; left: 10%; border-radius: 50%; }
    .blob-2 { width: 250px; height: 250px; background: #8b5cf6; bottom: 10%; right: 15%; border-radius: 50%; animation-delay: -6s; }

    .hero {
      text-align: center;
      max-width: 700px;
      padding: 50px 30px;
      z-index: 1;
      background: rgba(31, 41, 55, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 16px;
      line-height: 1.2;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.2s forwards;
    }

    .highlight {
      color: var(--primary-color);
    }

    .hero p {
      color: var(--text-main);
      font-size: 18px;
      margin-bottom: 40px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.4s forwards;
    }

    /* ========================================== */
    /* NEW ACTION LAYOUT                          */
    /* ========================================== */
    .primary-action {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.6s forwards;
      margin-bottom: 30px;
    }
    
    /* Massive Glowing Explore Button */
    .btn-explore {
      display: inline-block;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: white;
      font-size: 22px;
      font-weight: 800;
      padding: 16px 40px;
      border-radius: 50px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: gradientPulse 3s infinite;
      transition: transform 0.3s ease;
    }
    .btn-explore:hover {
      transform: scale(1.05);
    }

    /* Secondary Actions (Shop & Hire) */
    .secondary-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.8s forwards;
    }
    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-outline:hover {
      border-color: var(--primary-color);
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <div id="nav-container" style="width: 100%; position: relative; z-index: 10;"></div>

  <div class="container hero-wrapper">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="hero">
      <h1>Welcome to <span class="highlight">Sha's Designs.</span></h1>
      <p>Digital Graphic Designer specializing in modern branding, aesthetic templates, and custom visual art.</p>
      
      <!-- The Main Focus -->
      <div class="primary-action">
        <a href="explore.html" class="btn-explore">Explore My Work</a>
      </div>

      <!-- The Secondary Focus -->
      <div class="secondary-actions">
        <a href="shop.html" class="btn-outline">Shop Templates</a>
        <a href="hire.html" class="btn-outline">Contact & Hire</a>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
</body>
</html>
