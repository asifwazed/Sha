<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Admin | Sha's Designs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 500px;
      margin: 60px auto;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background-color: var(--bg-color); color: var(--text-main); box-sizing: border-box;
    }
    textarea { min-height: 100px; resize: vertical; }
    #status, #loginStatus { margin-top: 15px; font-weight: bold; text-align: center; color: var(--primary-color); }
    .hidden { display: none !important; }
    #loginScreen { text-align: center; }
    .logout-btn {
      background: transparent; color: var(--text-muted); border: none; 
      text-decoration: underline; cursor: pointer; float: right; margin-top: -40px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="admin-container" id="loginScreen">
    <h2 style="color: var(--primary-color); margin-bottom: 20px;">Admin Login</h2>
    <div class="form-group">
      <input type="email" id="adminEmail" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" id="adminPassword" placeholder="Password">
    </div>
    <button id="loginBtn" class="btn-primary" style="width: 100%;">Login</button>
    <div id="loginStatus"></div>
  </div>

  <!-- UPLOAD DASHBOARD -->
  <div class="admin-container hidden" id="uploadScreen">
    <button id="logoutBtn" class="logout-btn">Logout</button>
    <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 30px;">Studio Dashboard</h2>
    
    <div class="form-group">
      <label>Where are you uploading to?</label>
      <select id="uploadType">
        <option value="explore">Explore Page (Art & Posts)</option>
        <option value="shop">Shop Page (Templates for Sale)</option>
        <option value="portfolio">Hire Me Portfolio (Featured Work)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title / Project Name</label>
      <input type="text" id="postTitle" placeholder="e.g., Brand Identity Project">
    </div>

    <div class="form-group" id="captionGroup">
      <label>Caption / Details</label>
      <textarea id="postCaption" placeholder="Write something about this design..."></textarea>
    </div>

    <div class="form-group hidden" id="priceGroup">
      <label>Price ($)</label>
      <input type="number" id="postPrice" placeholder="e.g., 15">
    </div>

    <div class="form-group">
      <label>Upload Image</label>
      <input type="file" id="postImage" accept="image/*">
    </div>

    <button id="publishBtn" class="btn-primary" style="width: 100%;">Publish</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCecl3QPW8fkn3ZlfGqyo9VwC_Ar53br70",
      authDomain: "sha-s-designs.firebaseapp.com",
      projectId: "sha-s-designs",
      storageBucket: "sha-s-designs.firebasestorage.app",
      messagingSenderId: "34957426865",
      appId: "1:34957426865:web:023ba0243629949b12e290"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const IMGBB_API_KEY = a941c836ab5e48dacb236993354c1820; 

    const loginScreen = document.getElementById('loginScreen');
    const uploadScreen = document.getElementById('uploadScreen');
    const uploadType = document.getElementById('uploadType');
    const captionGroup = document.getElementById('captionGroup');
    const priceGroup = document.getElementById('priceGroup');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.classList.add('hidden');
        uploadScreen.classList.remove('hidden');
      } else {
        loginScreen.classList.remove('hidden');
        uploadScreen.classList.add('hidden');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        document.getElementById('loginStatus').innerText = "";
      } catch (error) {
        document.getElementById('loginStatus').innerText = "❌ Incorrect email or password.";
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); });

    uploadType.addEventListener('change', (e) => {
      if (e.target.value === 'shop') {
        captionGroup.classList.add('hidden');
        priceGroup.classList.remove('hidden');
      } else {
        captionGroup.classList.remove('hidden');
        priceGroup.classList.add('hidden');
      }
    });

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const type = uploadType.value;
      const title = document.getElementById('postTitle').value;
      const caption = document.getElementById('postCaption').value;
      const price = document.getElementById('postPrice').value;
      const fileInput = document.getElementById('postImage');
      const status = document.getElementById('status');

      if (!title || fileInput.files.length === 0) {
        status.innerText = "Please fill the title and select an image.";
        return;
      }
      if (type === 'shop' && !price) {
        status.innerText = "Please enter a price.";
        return;
      }

      status.innerText = "Uploading image securely...";
      document.getElementById('publishBtn').disabled = true;

      try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key= a941c836ab5e48dacb236993354c1820`, {
          method: "POST", body: formData
        });
        
        const imgbbData = await imgbbResponse.json();
        if (!imgbbData.success) throw new Error("Image upload failed.");

        const imageUrl = imgbbData.data.url;
        status.innerText = "Saving to database...";

        if (type === 'explore') {
          await addDoc(collection(db, "explore_posts"), { title, caption, imageUrl, createdAt: serverTimestamp() });
        } else if (type === 'shop') {
          await addDoc(collection(db, "shop_items"), { title, price, imageUrl, createdAt: serverTimestamp() });
        } else {
          await addDoc(collection(db, "portfolio_items"), { title, caption, imageUrl, createdAt: serverTimestamp() });
        }

        status.innerText = "✅ Published Successfully!";
        document.getElementById('postTitle').value = '';
        document.getElementById('postCaption').value = '';
        document.getElementById('postPrice').value = '';
        fileInput.value = '';

      } catch (error) {
        console.error(error);
        status.innerText = "❌ Error: " + error.message;
      } finally {
        document.getElementById('publishBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
