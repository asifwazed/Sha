<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Sha's Designs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 500px;
      margin: 60px auto;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-weight: bold;
    }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 30px;">Upload to Explore</h2>
    
    <div class="form-group">
      <label>Post Title</label>
      <input type="text" id="postTitle" placeholder="e.g., New Logo Design">
    </div>

    <div class="form-group">
      <label>Caption / Details</label>
      <textarea id="postCaption" placeholder="Write something about this design..."></textarea>
    </div>

    <div class="form-group">
      <label>Upload Image</label>
      <input type="file" id="postImage" accept="image/*">
    </div>

    <button id="publishBtn" class="btn-primary" style="width: 100%;">Publish Post</button>
    
    <div id="status"></div>
  </div>

  <script type="module">
    // 1. Initialize Firebase (For Database Only)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCecl3QPW8fkn3ZlfGqyo9VwC_Ar53br70",
      authDomain: "sha-s-designs.firebaseapp.com",
      projectId: "sha-s-designs",
      storageBucket: "sha-s-designs.firebasestorage.app",
      messagingSenderId: "34957426865",
      appId: "1:34957426865:web:023ba0243629949b12e290"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. ImgBB Key for Photos
    const IMGBB_API_KEY = a941c836ab5e48dacb236993354c1820; // <--- PASTE KEY HERE

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const title = document.getElementById('postTitle').value;
      const caption = document.getElementById('postCaption').value;
      const fileInput = document.getElementById('postImage');
      const status = document.getElementById('status');

      if (!title || !caption || fileInput.files.length === 0) {
        status.innerText = "Please fill all fields and select an image.";
        return;
      }

      const file = fileInput.files[0];
      status.innerText = "Uploading image to secure server...";
      document.getElementById('publishBtn').disabled = true;

      try {
        // Step A: Upload to ImgBB
        const formData = new FormData();
        formData.append("image", file);

        const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        
        const imgbbData = await imgbbResponse.json();
        
        if (!imgbbData.success) {
          throw new Error("Image upload failed.");
        }

        const imageUrl = imgbbData.data.url; // The live image link
        status.innerText = "Saving post data...";

        // Step B: Save Text and Image URL to Firebase
        await addDoc(collection(db, "explore_posts"), {
          title: title,
          caption: caption,
          imageUrl: imageUrl,
          createdAt: serverTimestamp()
        });

        status.innerText = "✅ Post Published Successfully!";
        
        // Clear form
        document.getElementById('postTitle').value = '';
        document.getElementById('postCaption').value = '';
        fileInput.value = '';

      } catch (error) {
        console.error(error);
        status.innerText = "❌ Error: " + error.message;
      } finally {
        document.getElementById('publishBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
