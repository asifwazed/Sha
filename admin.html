<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Sha's Designs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 500px;
      margin: 60px auto;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: var(--text-muted); font-weight: bold; }
    input[type="text"], input[type="number"], select, textarea, input[type="file"] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background-color: var(--bg-color); color: var(--text-main); box-sizing: border-box;
    }
    textarea { min-height: 100px; resize: vertical; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; color: var(--primary-color); }
    
    /* Hides the price/caption fields based on selection */
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 30px;">Studio Dashboard</h2>
    
    <div class="form-group">
      <label>Where are you uploading to?</label>
      <select id="uploadType">
        <option value="explore">Explore Page (Art & Posts)</option>
        <option value="shop">Shop Page (Templates for Sale)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="postTitle" placeholder="e.g., Pink Twitch Overlay">
    </div>

    <!-- Shows for Explore -->
    <div class="form-group" id="captionGroup">
      <label>Caption / Details</label>
      <textarea id="postCaption" placeholder="Write something about this design..."></textarea>
    </div>

    <!-- Shows for Shop -->
    <div class="form-group hidden" id="priceGroup">
      <label>Price ($)</label>
      <input type="number" id="postPrice" placeholder="e.g., 15">
    </div>

    <div class="form-group">
      <label>Upload Image</label>
      <input type="file" id="postImage" accept="image/*">
    </div>

    <button id="publishBtn" class="btn-primary" style="width: 100%;">Publish</button>
    
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCecl3QPW8fkn3ZlfGqyo9VwC_Ar53br70",
      authDomain: "sha-s-designs.firebaseapp.com",
      projectId: "sha-s-designs",
      storageBucket: "sha-s-designs.firebasestorage.app",
      messagingSenderId: "34957426865",
      appId: "1:34957426865:web:023ba0243629949b12e290"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // PASTE YOUR IMGBB KEY HERE
    const IMGBB_API_KEY = a941c836ab5e48dacb236993354c1820; 

    // UI Logic to switch between Explore/Shop fields
    const uploadType = document.getElementById('uploadType');
    const captionGroup = document.getElementById('captionGroup');
    const priceGroup = document.getElementById('priceGroup');

    uploadType.addEventListener('change', (e) => {
      if (e.target.value === 'shop') {
        captionGroup.classList.add('hidden');
        priceGroup.classList.remove('hidden');
      } else {
        captionGroup.classList.remove('hidden');
        priceGroup.classList.add('hidden');
      }
    });

    // Upload Logic
    document.getElementById('publishBtn').addEventListener('click', async () => {
      const type = uploadType.value;
      const title = document.getElementById('postTitle').value;
      const caption = document.getElementById('postCaption').value;
      const price = document.getElementById('postPrice').value;
      const fileInput = document.getElementById('postImage');
      const status = document.getElementById('status');

      if (!title || fileInput.files.length === 0) {
        status.innerText = "Please fill the title and select an image.";
        return;
      }
      if (type === 'shop' && !price) {
        status.innerText = "Please enter a price for the shop item.";
        return;
      }

      status.innerText = "Uploading image securely...";
      document.getElementById('publishBtn').disabled = true;

      try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        
        const imgbbData = await imgbbResponse.json();
        if (!imgbbData.success) throw new Error("Image upload failed.");

        const imageUrl = imgbbData.data.url;
        status.innerText = "Saving data to your database...";

        // Save to different Firebase folders based on selection
        if (type === 'explore') {
          await addDoc(collection(db, "explore_posts"), {
            title: title,
            caption: caption,
            imageUrl: imageUrl,
            createdAt: serverTimestamp()
          });
        } else {
          await addDoc(collection(db, "shop_items"), {
            title: title,
            price: price,
            imageUrl: imageUrl,
            createdAt: serverTimestamp()
          });
        }

        status.innerText = "✅ Published Successfully!";
        
        // Clear fields
        document.getElementById('postTitle').value = '';
        document.getElementById('postCaption').value = '';
        document.getElementById('postPrice').value = '';
        fileInput.value = '';

      } catch (error) {
        console.error(error);
        status.innerText = "❌ Error: " + error.message;
      } finally {
        document.getElementById('publishBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
